<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>Sorteio de Nomes e Números</title>
<meta name="description" content="Ninguém repete. Sorte pra todo mundo!">
<meta property="og:type" content="website">
<meta property="og:title" content="Sorteio de Nomes e Números">
<meta property="og:description" content="Ninguém repete. Sorte pra todo mundo!">
<meta property="og:image" content="https://sorteios-tau.vercel.app/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://sorteios-tau.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg1:#eef0ff;--bg2:#fdeefe;--bg3:#e3fbf4;
  --card:rgba(255,255,255,.66);--card-solid:#ffffff;
  --text:#1d1f2b;--muted:#6b7089;--border:rgba(108,92,231,.16);
  --input:rgba(255,255,255,.9);--chip:rgba(255,255,255,.95);
  --accent:#6c5ce7;--accent2:#a29bfe;--pink:#fd79a8;--ok:#00b894;--ok2:#55efc4;--danger:#e17055;
  --shadow:0 18px 50px rgba(108,92,231,.16);--shadow-sm:0 6px 18px rgba(108,92,231,.14);
  --dots:rgba(108,92,231,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#0f0e1c;--bg2:#1a1030;--bg3:#0a1c22;--card:rgba(30,28,50,.62);--card-solid:#1c1a30;
  --text:#eceef7;--muted:#a1a6c4;--border:rgba(162,155,254,.18);--input:rgba(20,19,36,.85);--chip:rgba(26,24,44,.95);
  --shadow:0 18px 50px rgba(0,0,0,.45);--shadow-sm:0 6px 18px rgba(0,0,0,.35);--dots:rgba(162,155,254,.10);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg1:#0f0e1c;--bg2:#1a1030;--bg3:#0a1c22;--card:rgba(30,28,50,.62);--card-solid:#1c1a30;
  --text:#eceef7;--muted:#a1a6c4;--border:rgba(162,155,254,.18);--input:rgba(20,19,36,.85);--chip:rgba(26,24,44,.95);
  --shadow:0 18px 50px rgba(0,0,0,.45);--shadow-sm:0 6px 18px rgba(0,0,0,.35);--dots:rgba(162,155,254,.10);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
  min-height:100vh;min-height:100dvh;display:flex;justify-content:center;
  padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));background-attachment:fixed;
  position:relative;overflow-x:hidden;
}
/* fundo: padrão de pontinhos + blobs + aurora */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(var(--dots) 1.4px,transparent 1.6px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);
}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;z-index:0;pointer-events:none;animation:float 16s ease-in-out infinite}
.b1{width:340px;height:340px;background:#a29bfe;top:-90px;left:-100px}
.b2{width:300px;height:300px;background:#fd79a8;bottom:-80px;right:-80px;animation-delay:-5s}
.b3{width:240px;height:240px;background:#55efc4;top:42%;left:62%;animation-delay:-9s;opacity:.32}
.b4{width:220px;height:220px;background:#74b9ff;top:18%;left:-70px;animation-delay:-12s;opacity:.3}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(36px,-30px) scale(1.12)}66%{transform:translate(-24px,26px) scale(.94)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

main{width:100%;max-width:600px;display:flex;flex-direction:column;gap:20px;position:relative;z-index:1}
.view{display:flex;flex-direction:column;gap:20px}
.hidden{display:none!important}

/* header */
header{text-align:center;padding-top:4px}
.logo{
  width:68px;height:68px;margin:0 auto 10px;border-radius:22px;display:grid;place-items:center;font-size:2rem;
  background:linear-gradient(135deg,var(--accent),var(--pink));box-shadow:0 12px 30px rgba(108,92,231,.4);
  animation:wob 4s ease-in-out infinite;
}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-3px)}}
h1{margin:0;font-size:2.2rem;font-weight:800;letter-spacing:-.8px;background:linear-gradient(90deg,var(--accent),var(--pink),var(--accent));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
header p{margin:6px 0 0;color:var(--muted);font-size:.92rem}

/* abas */
.tabs{
  display:flex;gap:6px;padding:6px;border-radius:20px;background:var(--card);border:1px solid var(--border);
  box-shadow:var(--shadow-sm);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
}
.tabs button{
  flex:1;padding:12px 10px;border-radius:15px;background:transparent;color:var(--muted);box-shadow:none;font-size:.92rem;
}
.tabs button:hover:not(:disabled){transform:none;box-shadow:none;filter:none;color:var(--accent)}
.tabs button.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 8px 20px rgba(108,92,231,.34),inset 0 1px 0 rgba(255,255,255,.28);
}
.tabs button.on:hover:not(:disabled){color:#fff}

/* cards */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:28px;padding:22px;
  box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  position:relative;
}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card h2{margin:0;font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:10px}
.card h2 .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:1rem;background:linear-gradient(135deg,rgba(108,92,231,.18),rgba(253,121,168,.18));border:1px solid var(--border)}
.count{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--accent);background:rgba(108,92,231,.12);margin-left:2px}

/* input */
.row{display:flex;gap:10px}
input[type=text],input[type=number],input:not([type]){
  flex:1;min-width:0;padding:14px 18px;border-radius:16px;border:1.5px solid var(--border);background:var(--input);color:var(--text);
  font:inherit;font-size:.95rem;outline:none;transition:border-color .2s,box-shadow .2s;
}
input::placeholder{color:var(--muted);opacity:.8}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(108,92,231,.16)}

/* intervalo de números */
.range{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 4px}
.field input{width:100%;font-size:1.25rem;font-weight:700;text-align:center;padding:14px 10px}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:.9rem;font-weight:500;cursor:pointer;user-select:none}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none;cursor:pointer}

/* botões */
button{
  border:0;border-radius:16px;padding:14px 22px;font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 20px rgba(108,92,231,.34),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,opacity .2s,filter .2s;
  position:relative;overflow:hidden;
}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 26px rgba(108,92,231,.42),inset 0 1px 0 rgba(255,255,255,.3);filter:brightness(1.05)}
button:active:not(:disabled){transform:scale(.96)}
button:focus-visible{outline:3px solid rgba(108,92,231,.45);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;filter:grayscale(.4)}
button.sec{background:var(--input);color:var(--muted);border:1.5px solid var(--border);box-shadow:none;padding:9px 15px;font-size:.82rem;border-radius:13px}
button.sec:hover:not(:disabled){color:var(--accent);border-color:var(--accent);box-shadow:var(--shadow-sm);filter:none}
button.danger{color:var(--danger);border-color:rgba(225,112,85,.4)}
button.danger:hover:not(:disabled){color:var(--danger);border-color:var(--danger);box-shadow:0 6px 18px rgba(225,112,85,.25)}
button.danger.confirm{background:linear-gradient(135deg,var(--danger),#fab1a0);color:#fff;border-color:transparent;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* progresso */
.bar{height:8px;border-radius:999px;background:rgba(108,92,231,.12);margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--ok),var(--ok2));transition:width .5s cubic-bezier(.3,1.2,.5,1)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;max-height:190px;overflow-y:auto;overscroll-behavior:contain;padding:4px 6px 4px 2px;scrollbar-width:thin;scrollbar-color:var(--accent2) transparent;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 14px),transparent);mask-image:linear-gradient(#000 calc(100% - 14px),transparent)}
.chips::-webkit-scrollbar{width:6px}
.chips::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:999px}
.chips:empty{display:none}
.chip{
  background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:5px 8px 5px 5px;font-size:.88rem;font-weight:500;
  display:flex;gap:9px;align-items:center;animation:in .35s cubic-bezier(.3,1.6,.5,1);box-shadow:0 2px 8px rgba(108,92,231,.07);
  transition:transform .15s,box-shadow .15s;
}
.chip:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.chip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff;flex:none}
.chip b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;line-height:1;background:rgba(225,112,85,.14);color:var(--danger);cursor:pointer;transition:.15s}
.chip b:hover{background:var(--danger);color:#fff;transform:rotate(90deg)}
.chip.done{opacity:.42}
.chip.done span.nm{text-decoration:line-through}
@keyframes in{from{opacity:0;transform:scale(.7) translateY(6px)}}
.muted{color:var(--muted);font-size:.82rem;margin:12px 0 0}

/* palco do sorteio */
.stage{text-align:center;padding:26px 22px 22px;overflow:hidden}
.stage::before{
  content:"";position:absolute;left:50%;top:38%;width:340px;height:340px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(108,92,231,.22),transparent 65%);pointer-events:none;
}
.label{position:relative;font-size:.74rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.res{
  position:relative;min-height:150px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(2rem,9vw,3.3rem);font-weight:800;word-break:break-word;line-height:1.1;margin-bottom:18px;border-radius:24px;padding:18px;
  background:linear-gradient(135deg,rgba(108,92,231,.1),rgba(253,121,168,.1));border:2px dashed var(--border);color:var(--accent);
  transition:background .3s,color .3s,box-shadow .3s;
}
.res.num{font-size:clamp(3rem,16vw,5.5rem);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.res.spin{filter:blur(1.4px);opacity:.85;border-color:var(--accent);animation:pulse .3s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.025)}}
.res.win{
  animation:pop .7s cubic-bezier(.2,1.7,.4,1);border-style:solid;border-color:transparent;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--pink));
  box-shadow:0 0 0 6px rgba(108,92,231,.14),0 0 50px rgba(108,92,231,.5),0 20px 40px rgba(253,121,168,.3);
  text-shadow:0 2px 14px rgba(0,0,0,.25);
}
@keyframes pop{0%{transform:scale(.5) rotate(-5deg);opacity:.4}100%{transform:scale(1) rotate(0);opacity:1}}
.big{
  width:100%;font-size:1.2rem;font-weight:700;padding:18px;border-radius:20px;letter-spacing:.2px;
  background:linear-gradient(135deg,var(--ok),var(--ok2));box-shadow:0 12px 28px rgba(0,184,148,.38),inset 0 1px 0 rgba(255,255,255,.35);
}
.big:hover:not(:disabled){box-shadow:0 16px 34px rgba(0,184,148,.48),inset 0 1px 0 rgba(255,255,255,.4)}
.big:not(:disabled)::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite;
}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}

/* histórico */
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;counter-reset:n}
ol li{
  counter-increment:n;display:flex;align-items:center;gap:13px;padding:11px 15px;border-radius:16px;font-weight:500;
  background:var(--chip);border:1px solid var(--border);animation:in .35s cubic-bezier(.3,1.6,.5,1);box-shadow:0 2px 8px rgba(108,92,231,.06);
}
ol li::before{
  content:counter(n);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--pink));flex:none;box-shadow:0 4px 10px rgba(108,92,231,.3);
}
ol li:last-child{border-color:var(--accent);background:linear-gradient(90deg,rgba(108,92,231,.1),var(--chip))}
ol.nums li{font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.88rem;text-align:center;padding:18px 0 8px}
.empty span{display:block;font-size:1.8rem;margin-bottom:4px;opacity:.7}

footer{text-align:center;color:var(--muted);font-size:.75rem;opacity:.7}
canvas{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (max-width:420px){
  .card{padding:18px;border-radius:24px}
  h1{font-size:1.9rem}
  button{padding:13px 18px}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<canvas id="fx"></canvas>
<main>
  <header>
    <div class="logo">🎲</div>
    <h1 id="titulo">Sorteio de Nomes</h1>
    <p>Ninguém repete. Sorte pra todo mundo!</p>
  </header>

  <nav class="tabs" role="tablist">
    <button id="tabNomes" class="on" role="tab">✍️ Nomes</button>
    <button id="tabNum" role="tab">🔢 Números</button>
  </nav>

  <!-- ============ NOMES ============ -->
  <div class="view" id="vNomes">
    <section class="card">
      <div class="top">
        <h2><span class="ico">✍️</span>Participantes<span class="count" id="count">0</span></h2>
        <button class="sec danger" id="clear">🗑️ Excluir tudo</button>
      </div>
      <div class="row">
        <input id="nome" placeholder="Digite um nome (ou cole vários)" autocomplete="off">
        <button id="add">＋ Add</button>
      </div>
      <div class="chips" id="lista"></div>
      <div class="bar"><i id="prog"></i></div>
      <p class="muted" id="info"></p>
    </section>

    <section class="card stage">
      <div class="label">E o sorteado é...</div>
      <div class="res" id="result">?</div>
      <button class="big" id="sortear">✨ Sortear!</button>
    </section>

    <section class="card">
      <div class="top">
        <h2><span class="ico">🏆</span>Já sorteados</h2>
        <button class="sec" id="reset">↺ Recomeçar</button>
      </div>
      <ol id="historico"></ol>
    </section>
  </div>

  <!-- ============ NÚMEROS ============ -->
  <div class="view hidden" id="vNum">
    <section class="card">
      <div class="top">
        <h2><span class="ico">🔢</span>Intervalo</h2>
      </div>
      <div class="range">
        <div class="field">
          <label for="nMin">De</label>
          <input id="nMin" type="number" inputmode="numeric" step="1" value="1">
        </div>
        <div class="field">
          <label for="nMax">Até</label>
          <input id="nMax" type="number" inputmode="numeric" step="1" value="60">
        </div>
      </div>
      <label class="check"><input type="checkbox" id="nRep"> Permitir números repetidos</label>
      <div class="bar"><i id="nProg"></i></div>
      <p class="muted" id="nInfo"></p>
    </section>

    <section class="card stage">
      <div class="label">O número sorteado é...</div>
      <div class="res num" id="resultN">?</div>
      <button class="big" id="sortearN">✨ Sortear número!</button>
    </section>

    <section class="card">
      <div class="top">
        <h2><span class="ico">🏆</span>Números sorteados</h2>
        <button class="sec" id="resetN">↺ Recomeçar</button>
      </div>
      <ol id="histN" class="nums"></ol>
    </section>
  </div>

  <footer>Feito com 💜 e um pouquinho de sorte</footer>
</main>

<script>
let nomes = [], sorteados = [];
let modo = "nomes";
let num = { min: 1, max: 60, hist: [], rep: false };
const $ = id => document.getElementById(id);

try {
  const s = JSON.parse(localStorage.getItem("sorteio") || "null");
  if (s) {
    nomes = s.nomes || []; sorteados = s.sorteados || [];
    if (s.modo === "numeros") modo = "numeros";
    if (s.num) num = Object.assign(num, s.num);
  }
} catch (e) {}
const salvar = () => { try { localStorage.setItem("sorteio", JSON.stringify({ nomes, sorteados, modo, num })); } catch (e) {} };

const GRADS = [
  "linear-gradient(135deg,#6c5ce7,#a29bfe)", "linear-gradient(135deg,#fd79a8,#e84393)",
  "linear-gradient(135deg,#00b894,#55efc4)", "linear-gradient(135deg,#0984e3,#74b9ff)",
  "linear-gradient(135deg,#e17055,#fab1a0)", "linear-gradient(135deg,#fdcb6e,#e1b12c)"
];
const grad = n => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return GRADS[h % GRADS.length]; };
const fmt = n => n.toLocaleString("pt-BR");

/* ---------- abas ---------- */
function setModo(m) {
  modo = m;
  const n = m === "nomes";
  $("vNomes").classList.toggle("hidden", !n);
  $("vNum").classList.toggle("hidden", n);
  $("tabNomes").classList.toggle("on", n);
  $("tabNum").classList.toggle("on", !n);
  $("titulo").textContent = n ? "Sorteio de Nomes" : "Sorteio de Números";
  salvar();
}
$("tabNomes").onclick = () => setModo("nomes");
$("tabNum").onclick = () => setModo("numeros");

/* ---------- NOMES ---------- */
function adicionar(texto) {
  texto.split(/\n|,|;/).map(n => n.trim()).filter(Boolean).forEach(n => {
    if (!nomes.some(x => x.toLowerCase() === n.toLowerCase())) nomes.push(n);
  });
  salvar(); render();
}

function render() {
  $("lista").innerHTML = "";
  nomes.forEach((n, i) => {
    const c = document.createElement("span");
    c.className = "chip" + (sorteados.includes(n) ? " done" : "");
    const av = document.createElement("span");
    av.className = "av"; av.style.background = grad(n);
    av.textContent = (n.trim()[0] || "?").toUpperCase();
    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = n;
    const x = document.createElement("b");
    x.textContent = "×";
    x.onclick = () => { nomes.splice(i, 1); sorteados = sorteados.filter(s => s !== n); salvar(); render(); };
    c.append(av, nm, x);
    $("lista").appendChild(c);
  });
  const restam = nomes.filter(n => !sorteados.includes(n)).length;
  $("count").textContent = nomes.length;
  $("info").textContent = nomes.length ? `${restam} de ${nomes.length} ainda no sorteio` : "Adiciona uns nomes pra começar.";
  $("prog").style.width = nomes.length ? (sorteados.length / nomes.length * 100) + "%" : "0%";
  $("sortear").disabled = restam === 0;
  const h = $("historico");
  h.innerHTML = "";
  if (!sorteados.length) { h.innerHTML = '<div class="empty"><span>🎟️</span>Ninguém sorteado ainda</div>'; return; }
  sorteados.forEach(n => { const li = document.createElement("li"); li.textContent = n; h.appendChild(li); });
}

$("add").onclick = () => { adicionar($("nome").value); $("nome").value = ""; $("nome").focus(); };
$("nome").addEventListener("keydown", e => { if (e.key === "Enter") $("add").click(); });
$("nome").addEventListener("paste", e => {
  const t = (e.clipboardData || window.clipboardData).getData("text");
  if (/\n/.test(t)) { e.preventDefault(); adicionar(t); }
});

$("sortear").onclick = () => {
  const disp = nomes.filter(n => !sorteados.includes(n));
  if (!disp.length) return;
  const final = disp[Math.floor(Math.random() * disp.length)];
  const r = $("result");
  r.classList.remove("win"); r.classList.add("spin");
  $("sortear").disabled = true;
  let t = 0;
  const iv = setInterval(() => {
    r.textContent = disp[Math.floor(Math.random() * disp.length)];
    if (++t >= 18) {
      clearInterval(iv);
      r.classList.remove("spin");
      r.textContent = final;
      void r.offsetWidth;
      r.classList.add("win");
      sorteados.push(final);
      salvar(); render(); confete();
    }
  }, 75);
};

$("reset").onclick = () => {
  sorteados = []; const r = $("result"); r.textContent = "?"; r.classList.remove("win"); salvar(); render();
};

let confirmTimer = null;
$("clear").onclick = () => {
  const b = $("clear");
  if (!nomes.length) return;
  if (!b.classList.contains("confirm")) {
    b.classList.add("confirm");
    b.textContent = "Certeza? Clica de novo";
    confirmTimer = setTimeout(() => { b.classList.remove("confirm"); b.textContent = "🗑️ Excluir tudo"; }, 3500);
    return;
  }
  clearTimeout(confirmTimer);
  b.classList.remove("confirm");
  b.textContent = "🗑️ Excluir tudo";
  nomes = []; sorteados = [];
  const r = $("result"); r.textContent = "?"; r.classList.remove("win");
  salvar(); render();
};

/* ---------- NÚMEROS ---------- */
function intervaloValido() {
  const { min, max } = num;
  return Number.isSafeInteger(min) && Number.isSafeInteger(max) && min <= max;
}
// números já sorteados que estão dentro do intervalo atual
function usadosNoIntervalo() {
  return new Set(num.hist.filter(n => n >= num.min && n <= num.max));
}

function renderNum() {
  const ok = intervaloValido();
  const total = ok ? num.max - num.min + 1 : 0;
  const usados = ok ? usadosNoIntervalo().size : 0;
  const restam = num.rep ? total : total - usados;

  if (!ok) {
    $("nInfo").textContent = "Confira o intervalo: o primeiro número precisa ser menor ou igual ao segundo.";
    $("nProg").style.width = "0%";
  } else if (num.rep) {
    $("nInfo").textContent = `${fmt(total)} números possíveis (de ${fmt(num.min)} a ${fmt(num.max)}) · podem repetir`;
    $("nProg").style.width = "0%";
  } else {
    $("nInfo").textContent = `${fmt(restam)} de ${fmt(total)} números ainda no sorteio`;
    $("nProg").style.width = (usados / total * 100) + "%";
  }
  $("sortearN").disabled = !ok || restam <= 0;

  const h = $("histN");
  h.innerHTML = "";
  if (!num.hist.length) { h.innerHTML = '<div class="empty"><span>🎟️</span>Nenhum número sorteado ainda</div>'; return; }
  num.hist.forEach(n => { const li = document.createElement("li"); li.textContent = fmt(n); h.appendChild(li); });
}

function lerCampos() {
  const a = parseInt($("nMin").value, 10), b = parseInt($("nMax").value, 10);
  num.min = a; num.max = b;
  num.rep = $("nRep").checked;
  salvar(); renderNum();
}
["nMin", "nMax"].forEach(id => $(id).addEventListener("input", lerCampos));
$("nRep").addEventListener("change", lerCampos);
["nMin", "nMax"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") $("sortearN").click(); }));

function aleatorioNoIntervalo() {
  const { min, max } = num;
  const total = max - min + 1;
  const rnd = () => min + Math.floor(Math.random() * total);
  if (num.rep) return rnd();
  const usados = usadosNoIntervalo();
  if (usados.size >= total) return null;
  if (usados.size < total / 2) {
    let x; do { x = rnd(); } while (usados.has(x));
    return x;
  }
  const livres = [];
  for (let n = min; n <= max; n++) if (!usados.has(n)) livres.push(n);
  return livres[Math.floor(Math.random() * livres.length)];
}

$("sortearN").onclick = () => {
  if (!intervaloValido()) return;
  const final = aleatorioNoIntervalo();
  if (final === null) return;
  const r = $("resultN");
  r.classList.remove("win"); r.classList.add("spin");
  $("sortearN").disabled = true;
  let t = 0;
  const iv = setInterval(() => {
    r.textContent = fmt(num.min + Math.floor(Math.random() * (num.max - num.min + 1)));
    if (++t >= 18) {
      clearInterval(iv);
      r.classList.remove("spin");
      r.textContent = fmt(final);
      void r.offsetWidth;
      r.classList.add("win");
      num.hist.push(final);
      salvar(); renderNum(); confete();
    }
  }, 75);
};

$("resetN").onclick = () => {
  num.hist = []; const r = $("resultN"); r.textContent = "?"; r.classList.remove("win"); salvar(); renderNum();
};

/* ---------- confete ---------- */
const cv = $("fx"), ctx = cv.getContext("2d");
let parts = [], anim = null;
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", resize); resize();
function confete() {
  const cores = ["#6c5ce7", "#fd79a8", "#55efc4", "#ffeaa7", "#74b9ff", "#e17055"];
  for (let i = 0; i < 180; i++) parts.push({
    x: cv.width / 2, y: cv.height * 0.45,
    vx: (Math.random() - .5) * 18, vy: Math.random() * -15 - 3,
    s: Math.random() * 8 + 4, c: cores[i % cores.length], round: i % 4 === 0,
    r: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 130
  });
  if (!anim) loop();
}
function loop() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += .35; p.vx *= .99; p.r += p.vr; p.life--;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.globalAlpha = Math.max(p.life / 130, 0);
    ctx.fillStyle = p.c;
    if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); }
    else ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
    ctx.restore();
  });
  parts = parts.filter(p => p.life > 0);
  anim = parts.length ? requestAnimationFrame(loop) : null;
  if (!anim) ctx.clearRect(0, 0, cv.width, cv.height);
}

/* ---------- início ---------- */
$("nMin").value = Number.isFinite(num.min) ? num.min : "";
$("nMax").value = Number.isFinite(num.max) ? num.max : "";
$("nRep").checked = !!num.rep;
render();
renderNum();
setModo(modo);
</script>
