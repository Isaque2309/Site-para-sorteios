<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>Sorteio de Nomes, Números e Chaveamento</title>
<meta name="description" content="Ninguém repete. Sorte pra todo mundo!">
<meta property="og:type" content="website">
<meta property="og:title" content="Sorteio de Nomes, Números e Chaveamento">
<meta property="og:description" content="Ninguém repete. Sorte pra todo mundo!">
<meta property="og:image" content="https://sorteios-tau.vercel.app/og-image.jpg?v=2">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://sorteios-tau.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg1:#eef0ff;--bg2:#fdeefe;--bg3:#e3fbf4;
  --card:rgba(255,255,255,.66);--card-solid:#ffffff;
  --text:#1d1f2b;--muted:#6b7089;--border:rgba(108,92,231,.16);
  --input:rgba(255,255,255,.9);--chip:rgba(255,255,255,.95);
  --accent:#6c5ce7;--accent2:#a29bfe;--pink:#fd79a8;--ok:#00b894;--ok2:#55efc4;--danger:#e17055;
  --shadow:0 18px 50px rgba(108,92,231,.16);--shadow-sm:0 6px 18px rgba(108,92,231,.14);
  --dots:rgba(108,92,231,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#0f0e1c;--bg2:#1a1030;--bg3:#0a1c22;--card:rgba(30,28,50,.62);--card-solid:#1c1a30;
  --text:#eceef7;--muted:#a1a6c4;--border:rgba(162,155,254,.18);--input:rgba(20,19,36,.85);--chip:rgba(26,24,44,.95);
  --shadow:0 18px 50px rgba(0,0,0,.45);--shadow-sm:0 6px 18px rgba(0,0,0,.35);--dots:rgba(162,155,254,.10);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg1:#0f0e1c;--bg2:#1a1030;--bg3:#0a1c22;--card:rgba(30,28,50,.62);--card-solid:#1c1a30;
  --text:#eceef7;--muted:#a1a6c4;--border:rgba(162,155,254,.18);--input:rgba(20,19,36,.85);--chip:rgba(26,24,44,.95);
  --shadow:0 18px 50px rgba(0,0,0,.45);--shadow-sm:0 6px 18px rgba(0,0,0,.35);--dots:rgba(162,155,254,.10);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
  min-height:100vh;min-height:100dvh;display:flex;justify-content:center;
  padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));background-attachment:fixed;
  position:relative;overflow-x:hidden;
}
/* fundo: padrão de pontinhos + blobs + aurora */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(var(--dots) 1.4px,transparent 1.6px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);
}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;z-index:0;pointer-events:none;animation:float 16s ease-in-out infinite}
.b1{width:340px;height:340px;background:#a29bfe;top:-90px;left:-100px}
.b2{width:300px;height:300px;background:#fd79a8;bottom:-80px;right:-80px;animation-delay:-5s}
.b3{width:240px;height:240px;background:#55efc4;top:42%;left:62%;animation-delay:-9s;opacity:.32}
.b4{width:220px;height:220px;background:#74b9ff;top:18%;left:-70px;animation-delay:-12s;opacity:.3}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(36px,-30px) scale(1.12)}66%{transform:translate(-24px,26px) scale(.94)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

main{width:100%;max-width:600px;display:flex;flex-direction:column;gap:20px;position:relative;z-index:1}
.view{display:flex;flex-direction:column;gap:20px}
.hidden{display:none!important}

/* header */
header{text-align:center;padding-top:4px}
.logo{
  width:68px;height:68px;margin:0 auto 10px;border-radius:22px;display:grid;place-items:center;font-size:2rem;
  background:linear-gradient(135deg,var(--accent),var(--pink));box-shadow:0 12px 30px rgba(108,92,231,.4);
  animation:wob 4s ease-in-out infinite;
}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-3px)}}
h1{margin:0;font-size:2.2rem;font-weight:800;letter-spacing:-.8px;background:linear-gradient(90deg,var(--accent),var(--pink),var(--accent));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
header p{margin:6px 0 0;color:var(--muted);font-size:.92rem}

/* abas */
.tabs{
  display:flex;gap:6px;padding:6px;border-radius:20px;background:var(--card);border:1px solid var(--border);
  box-shadow:var(--shadow-sm);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
}
.tabs button{
  flex:1;padding:12px 10px;border-radius:15px;background:transparent;color:var(--muted);box-shadow:none;font-size:.92rem;
}
.tabs button:hover:not(:disabled){transform:none;box-shadow:none;filter:none;color:var(--accent)}
.tabs button.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 8px 20px rgba(108,92,231,.34),inset 0 1px 0 rgba(255,255,255,.28);
}
.tabs button.on:hover:not(:disabled){color:#fff}

/* cards */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:28px;padding:22px;
  box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  position:relative;
}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card h2{margin:0;font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:10px}
.card h2 .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:1rem;background:linear-gradient(135deg,rgba(108,92,231,.18),rgba(253,121,168,.18));border:1px solid var(--border)}
.count{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--accent);background:rgba(108,92,231,.12);margin-left:2px}

/* input */
.row{display:flex;gap:10px}
input[type=text],input[type=number],input:not([type]){
  flex:1;min-width:0;padding:14px 18px;border-radius:16px;border:1.5px solid var(--border);background:var(--input);color:var(--text);
  font:inherit;font-size:.95rem;outline:none;transition:border-color .2s,box-shadow .2s;
}
input::placeholder{color:var(--muted);opacity:.8}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(108,92,231,.16)}

/* intervalo de números */
.range{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 4px}
.field input{width:100%;font-size:1.25rem;font-weight:700;text-align:center;padding:14px 10px}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:.9rem;font-weight:500;cursor:pointer;user-select:none}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none;cursor:pointer}

/* botões */
button{
  border:0;border-radius:16px;padding:14px 22px;font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 20px rgba(108,92,231,.34),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,opacity .2s,filter .2s;
  position:relative;overflow:hidden;
}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 26px rgba(108,92,231,.42),inset 0 1px 0 rgba(255,255,255,.3);filter:brightness(1.05)}
button:active:not(:disabled){transform:scale(.96)}
button:focus-visible{outline:3px solid rgba(108,92,231,.45);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;filter:grayscale(.4)}
button.sec{background:var(--input);color:var(--muted);border:1.5px solid var(--border);box-shadow:none;padding:9px 15px;font-size:.82rem;border-radius:13px}
button.sec:hover:not(:disabled){color:var(--accent);border-color:var(--accent);box-shadow:var(--shadow-sm);filter:none}
button.danger{color:var(--danger);border-color:rgba(225,112,85,.4)}
button.danger:hover:not(:disabled){color:var(--danger);border-color:var(--danger);box-shadow:0 6px 18px rgba(225,112,85,.25)}
button.danger.confirm{background:linear-gradient(135deg,var(--danger),#fab1a0);color:#fff;border-color:transparent;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* progresso */
.bar{height:8px;border-radius:999px;background:rgba(108,92,231,.12);margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--ok),var(--ok2));transition:width .5s cubic-bezier(.3,1.2,.5,1)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;max-height:190px;overflow-y:auto;overscroll-behavior:contain;padding:4px 6px 4px 2px;scrollbar-width:thin;scrollbar-color:var(--accent2) transparent;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 14px),transparent);mask-image:linear-gradient(#000 calc(100% - 14px),transparent)}
.chips::-webkit-scrollbar{width:6px}
.chips::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:999px}
.chips:empty{display:none}
.chip{
  background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:5px 8px 5px 5px;font-size:.88rem;font-weight:500;
  display:flex;gap:9px;align-items:center;animation:in .35s cubic-bezier(.3,1.6,.5,1);box-shadow:0 2px 8px rgba(108,92,231,.07);
  transition:transform .15s,box-shadow .15s;
}
.chip:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.chip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff;flex:none}
.chip b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;line-height:1;background:rgba(225,112,85,.14);color:var(--danger);cursor:pointer;transition:.15s}
.chip b:hover{background:var(--danger);color:#fff;transform:rotate(90deg)}
.chip.done{opacity:.42}
.chip.done span.nm{text-decoration:line-through}
@keyframes in{from{opacity:0;transform:scale(.7) translateY(6px)}}
.muted{color:var(--muted);font-size:.82rem;margin:12px 0 0}

/* palco do sorteio */
.stage{text-align:center;padding:26px 22px 22px;overflow:hidden}
.stage::before{
  content:"";position:absolute;left:50%;top:38%;width:340px;height:340px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(108,92,231,.22),transparent 65%);pointer-events:none;
}
.label{position:relative;font-size:.74rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.res{
  position:relative;min-height:150px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(2rem,9vw,3.3rem);font-weight:800;word-break:break-word;line-height:1.1;margin-bottom:18px;border-radius:24px;padding:18px;
  background:linear-gradient(135deg,rgba(108,92,231,.1),rgba(253,121,168,.1));border:2px dashed var(--border);color:var(--accent);
  transition:background .3s,color .3s,box-shadow .3s;
}
.res.num{font-size:clamp(3rem,16vw,5.5rem);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.res.spin{filter:blur(1.4px);opacity:.85;border-color:var(--accent);animation:pulse .3s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.025)}}
.res.win{
  animation:pop .7s cubic-bezier(.2,1.7,.4,1);border-style:solid;border-color:transparent;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--pink));
  box-shadow:0 0 0 6px rgba(108,92,231,.14),0 0 50px rgba(108,92,231,.5),0 20px 40px rgba(253,121,168,.3);
  text-shadow:0 2px 14px rgba(0,0,0,.25);
}
@keyframes pop{0%{transform:scale(.5) rotate(-5deg);opacity:.4}100%{transform:scale(1) rotate(0);opacity:1}}
.big{
  width:100%;font-size:1.2rem;font-weight:700;padding:18px;border-radius:20px;letter-spacing:.2px;
  background:linear-gradient(135deg,var(--ok),var(--ok2));box-shadow:0 12px 28px rgba(0,184,148,.38),inset 0 1px 0 rgba(255,255,255,.35);
}
.big:hover:not(:disabled){box-shadow:0 16px 34px rgba(0,184,148,.48),inset 0 1px 0 rgba(255,255,255,.4)}
.big:not(:disabled)::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite;
}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}

/* histórico */
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;counter-reset:n}
ol li{
  counter-increment:n;display:flex;align-items:center;gap:13px;padding:11px 15px;border-radius:16px;font-weight:500;
  background:var(--chip);border:1px solid var(--border);animation:in .35s cubic-bezier(.3,1.6,.5,1);box-shadow:0 2px 8px rgba(108,92,231,.06);
}
ol li::before{
  content:counter(n);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--pink));flex:none;box-shadow:0 4px 10px rgba(108,92,231,.3);
}
ol li:last-child{border-color:var(--accent);background:linear-gradient(90deg,rgba(108,92,231,.1),var(--chip))}
ol.nums li{font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.88rem;text-align:center;padding:18px 0 8px}
.empty span{display:block;font-size:1.8rem;margin-bottom:4px;opacity:.7}

/* chaveamento */
.tabs button small{display:block;font-size:.7rem;font-weight:500;opacity:.85;margin-top:1px}
.tabs.sub{box-shadow:none;margin-top:14px;background:var(--input)}
.tabs.sub button{padding:10px 8px;font-size:.86rem}
#vChave>.card:not(#cOut),#vChave>.tabs{width:100%;max-width:600px;align-self:center}
main{transition:max-width .25s}
main.wide{max-width:1280px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px}
.sh:first-of-type{margin-top:4px}
.sl{font-size:.8rem;font-weight:700;color:var(--accent)}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tc{display:flex;align-items:center;gap:8px;padding:7px 13px 7px 8px;border-radius:999px;background:var(--chip);border:1.5px solid var(--border);font-size:.84rem;font-weight:600;cursor:pointer;user-select:none;transition:transform .15s,box-shadow .15s,background .2s}
.tc:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.tc:focus-visible{outline:3px solid rgba(108,92,231,.45);outline-offset:2px}
.tc i{font-style:normal;font-size:.68rem;font-weight:800;color:var(--accent);min-width:20px;text-align:center;padding:2px 6px;border-radius:7px}
.tc.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(108,92,231,.32)}
.tc.on i{background:rgba(0,0,0,.24);color:#fff}
.tc.on::after{content:"✓";font-size:.8rem}
/* chave simétrica */
.scroll{overflow-x:auto;padding:70px 6px 14px;scrollbar-width:thin;scrollbar-color:var(--accent2) transparent}
.tree{--ln:var(--accent2);display:flex;align-items:center;width:max-content;margin:0 auto}
.half{display:flex}
.nd{display:flex;align-items:center;padding:5px 0}
.rt .nd{flex-direction:row-reverse}
.kids{display:flex;flex-direction:column;position:relative;margin-right:16px}
.kids::after{content:"";position:absolute;right:-8px;top:25%;bottom:25%;border-left:2px solid var(--ln)}
.rt .kids{margin-right:0;margin-left:16px}
.rt .kids::after{right:auto;left:-8px}
.mt{position:relative;width:142px;flex:none;background:var(--chip);border:1px solid var(--border);border-radius:12px;box-shadow:0 2px 8px rgba(108,92,231,.08)}
.mt.out::after{content:"";position:absolute;top:50%;margin-top:-1px;left:100%;width:8px;border-top:2px solid var(--ln)}
.mt.has::before{content:"";position:absolute;top:50%;margin-top:-1px;right:100%;width:8px;border-top:2px solid var(--ln)}
.rt .mt.out::after{left:auto;right:100%}
.rt .mt.has::before{right:auto;left:100%}
.mt.root::after{width:14px}
.mid{padding:0 14px;position:relative}
.fin{position:relative}
.fin h4{position:absolute;bottom:100%;left:0;right:0;margin:0 0 6px;text-align:center;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fin .mt{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.14)}
.fin .champ{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin:0 0 30px;white-space:nowrap;animation:none;padding:9px 16px;font-size:.95rem}
.tm{height:34px;line-height:34px;padding:0 10px;font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s}
.tm:first-child{border-radius:11px 11px 0 0}
.tm:last-child{border-radius:0 0 11px 11px}
.tm+.tm{border-top:1px solid var(--border)}
.tm.clk{cursor:pointer}
.tm.clk:hover{background:rgba(108,92,231,.14)}
.tm.w{background:linear-gradient(90deg,rgba(0,184,148,.28),rgba(0,184,148,.06));font-weight:700}
.tm.l{opacity:.45;text-decoration:line-through}
.tm.bye,.tm.tbd{color:var(--muted);font-style:italic;font-size:.76rem}
.champ{text-align:center;color:#fff;font-weight:800;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--pink));box-shadow:0 8px 22px rgba(108,92,231,.35)}
.grp{background:var(--chip);border:1px solid var(--border);border-radius:18px;padding:14px 16px;margin-top:12px}
.grp:first-child{margin-top:0}
.grp h3{margin:0 0 10px;font-size:.95rem;font-weight:700;color:var(--accent)}
.grp ul{margin:0 0 10px;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.grp li{padding:4px 12px;border-radius:999px;font-size:.85rem;font-weight:600;background:rgba(108,92,231,.12);color:var(--text)}
.rod{font-size:.84rem;color:var(--muted);margin:5px 0;line-height:1.5}
.rod b{color:var(--text);margin-right:4px}

footer{text-align:center;color:var(--muted);font-size:.75rem;opacity:.7}
canvas{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (max-width:420px){
  .card{padding:18px;border-radius:24px}
  h1{font-size:1.9rem}
  button{padding:13px 18px}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<canvas id="fx"></canvas>
<main>
  <header>
    <div class="logo">🎲</div>
    <h1 id="titulo">Sorteio de Nomes</h1>
    <p>Ninguém repete. Sorte pra todo mundo!</p>
  </header>

  <nav class="tabs" role="tablist">
    <button id="tabNomes" class="on" role="tab">✍️ Nomes</button>
    <button id="tabNum" role="tab">🔢 Números</button>
    <button id="tabChave" role="tab">🏆 Chaves</button>
  </nav>

  <!-- ============ NOMES ============ -->
  <div class="view" id="vNomes">
    <section class="card">
      <div class="top">
        <h2><span class="ico">✍️</span>Participantes<span class="count" id="count">0</span></h2>
        <button class="sec danger" id="clear">🗑️ Excluir tudo</button>
      </div>
      <div class="row">
        <input id="nome" placeholder="Digite um nome (ou cole vários)" autocomplete="off">
        <button id="add">＋ Add</button>
      </div>
      <div class="chips" id="lista"></div>
      <div class="bar"><i id="prog"></i></div>
      <p class="muted" id="info"></p>
    </section>

    <section class="card stage">
      <div class="label">E o sorteado é...</div>
      <div class="res" id="result">?</div>
      <button class="big" id="sortear">✨ Sortear!</button>
    </section>

        </div>
      </div>

        <button class="sec danger" id="cReset">🗑️ Resetar chaveamento</button>
      </div>

</main>

<script>
let nomes = [], sorteados = [];
let modo = "nomes";
let num = { min: 1, max: 60, hist: [], rep: false };
const TURMAS = [
  { serie: 1, nome: "1EM - Turma A", curto: "1EM A", b: "A" },
  { serie: 1, nome: "1EM - Turma B", curto: "1EM B", b: "B" },
  { serie: 1, nome: "1EM - Turma C", curto: "1EM C", b: "C" },
  { serie: 1, nome: "1EM - Turma D", curto: "1EM D", b: "D" },
  { serie: 1, nome: "1EM - Turma E", curto: "1EM E", b: "E" },
  { serie: 2, nome: "2EM - Turma A", curto: "2EM A", b: "A" },
  { serie: 2, nome: "2EM - Turma B", curto: "2EM B", b: "B" },
  { serie: 2, nome: "2EM - Turma C (D.S)", curto: "2EM C (D.S)", b: "C-D.S" },
  { serie: 2, nome: "2EM - Turma D (D.S)", curto: "2EM D (D.S)", b: "D-D.S" },
  { serie: 2, nome: "2EM - ADM (Administração)", curto: "2EM ADM", b: "ADM" },
  { serie: 3, nome: "3EM - Turma A", curto: "3EM A", b: "A" },
  { serie: 3, nome: "3EM - Turma B", curto: "3EM B", b: "B" },
  { serie: 3, nome: "3EM - Turma C", curto: "3EM C", b: "C" },
  { serie: 3, nome: "3EM - Turma D", curto: "3EM D", b: "D" },
  { serie: 3, nome: "3EM - D.S (Dev. de Sistemas)", curto: "3EM D.S", b: "D.S" },
  { serie: 3, nome: "3EM - ADM (Administração)", curto: "3EM ADM", b: "ADM" }
];
// fundamental II (tarde)
[[6, "ABCD"], [7, "ABC"], [8, "ABCD"], [9, "ABCD"]].forEach(([sr, ls]) => [...ls].forEach(l =>
  TURMAS.push({ serie: sr, nome: `${sr}º ANO - Turma ${l}`, curto: `${sr}º ${l}`, b: l, turno: "tarde" })));
TURMAS.forEach(t => { if (!t.turno) t.turno = "manha"; });
const SERIES = { 1: "1º ANOS EM", 2: "2º ANOS EM", 3: "3º ANOS EM", 6: "6º ANOS EF", 7: "7º ANOS EF", 8: "8º ANOS EF", 9: "9º ANOS EF" };
const TURNOS = {
  manha: { nome: "Manhã", sub: "Ensino Médio", series: [1, 2, 3] },
  tarde: { nome: "Tarde", sub: "Fundamental II", series: [6, 7, 8, 9] }
};
const novaMod = () => ({ sel: [], formato: "mata", grupos: 2, titulo: "", sorteio: null });
let ch = { mod: "futsal", turno: "manha", d: { futsal_manha: novaMod(), futsal_tarde: novaMod(), volei_manha: novaMod(), volei_tarde: novaMod() } };
const cur = () => ch.d[ch.mod + "_" + ch.turno];
const curto = n => (TURMAS.find(t => t.nome === n) || {}).curto || n;
const $ = id => document.getElementById(id);

try {
  const s = JSON.parse(localStorage.getItem("sorteio") || "null");
  if (s) {
    nomes = s.nomes || []; sorteados = s.sorteados || [];
    if (s.modo === "numeros" || s.modo === "chave") modo = s.modo;
    if (s.num) num = Object.assign(num, s.num);
    if (s.ch && s.ch.d) {
      ch.mod = s.ch.mod === "volei" ? "volei" : "futsal";
      ch.turno = s.ch.turno === "tarde" ? "tarde" : "manha";
      // salvos antes dos turnos (chaves "futsal"/"volei") eram do ensino médio = manhã
      for (const k of Object.keys(ch.d)) { const [m, t] = k.split("_"); ch.d[k] = Object.assign(novaMod(), s.ch.d[k] || (t === "manha" ? s.ch.d[m] : null) || {}); }
    }
  }
} catch (e) {}
const salvar = () => { try { localStorage.setItem("sorteio", JSON.stringify({ nomes, sorteados, modo, num, ch })); } catch (e) {} };

const GRADS = [
  "linear-gradient(135deg,#6c5ce7,#a29bfe)", "linear-gradient(135deg,#fd79a8,#e84393)",
  "linear-gradient(135deg,#00b894,#55efc4)", "linear-gradient(135deg,#0984e3,#74b9ff)",
  "linear-gradient(135deg,#e17055,#fab1a0)", "linear-gradient(135deg,#fdcb6e,#e1b12c)"
];
const grad = n => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return GRADS[h % GRADS.length]; };
const fmt = n => n.toLocaleString("pt-BR");

/* ---------- abas ---------- */
function setModo(m) {
  modo = m;
  const mapa = {
    nomes:   ["vNomes", "tabNomes", "Sorteio de Nomes"],
    numeros: ["vNum", "tabNum", "Sorteio de Números"],
    chave:   ["vChave", "tabChave", "Chaveamento"]
  };
  for (const k in mapa) {
    $(mapa[k][0]).classList.toggle("hidden", k !== m);
    $(mapa[k][1]).classList.toggle("on", k === m);
  }
  $("titulo").textContent = mapa[m][2];
  larguraChave();
  salvar();
}
$("tabNomes").onclick = () => setModo("nomes");
$("tabNum").onclick = () => setModo("numeros");
$("tabChave").onclick = () => setModo("chave");

/* ---------- NOMES ---------- */
function adicionar(texto) {
  texto.split(/\n|,|;/).map(n => n.trim()).filter(Boolean).forEach(n => {
    if (!nomes.some(x => x.toLowerCase() === n.toLowerCase())) nomes.push(n);
  });
  salvar(); render();
}

function render() {
  $("lista").innerHTML = "";
  nomes.forEach((n, i) => {
    const c = document.createElement("span");
    c.className = "chip" + (sorteados.includes(n) ? " done" : "");
    const av = document.createElement("span");
    av.className = "av"; av.style.background = grad(n);
    av.textContent = (n.trim()[0] || "?").toUpperCase();
    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = n;
    const x = document.createElement("b");
    x.textContent = "×";
    x.onclick = () => { nomes.splice(i, 1); sorteados = sorteados.filter(s => s !== n); salvar(); render(); };
    c.append(av, nm, x);
    $("lista").appendChild(c);
  });
  const restam = nomes.filter(n => !sorteados.includes(n)).length;
  $("count").textContent = nomes.length;
  $("info").textContent = nomes.length ? `${restam} de ${nomes.length} ainda no sorteio` : "Adiciona uns nomes pra começar.";
  $("prog").style.width = nomes.length ? (sorteados.length / nomes.length * 100) + "%" : "0%";
  $("sortear").disabled = restam === 0;
  const h = $("historico");
  h.innerHTML = "";
  if (!sorteados.length) { h.innerHTML = '<div class="empty"><span>🎟️</span>Ninguém sorteado ainda</div>'; return; }
  sorteados.forEach(n => { const li = document.createElement("li"); li.textContent = n; h.appendChild(li); });
}

$("add").onclick = () => { adicionar($("nome").value); $("nome").value = ""; $("nome").focus(); };
$("nome").addEventListener("keydown", e => { if (e.key === "Enter") $("add").click(); });
$("nome").addEventListener("paste", e => {
  const t = (e.clipboardData || window.clipboardData).getData("text");
  if (/\n/.test(t)) { e.preventDefault(); adicionar(t); }
});

$("sortear").onclick = () => {
  const disp = nomes.filter(n => !sorteados.includes(n));
  if (!disp.length) return;
  const final = disp[Math.floor(Math.random() * disp.length)];
  const r = $("result");
  r.classList.remove("win"); r.classList.add("spin");
  $("sortear").disabled = true;
  let t = 0;
  const iv = setInterval(() => {
    r.textContent = disp[Math.floor(Math.random() * disp.length)];
    if (++t >= 18) {
      clearInterval(iv);
      r.classList.remove("spin");
      r.textContent = final;
      void r.offsetWidth;
      r.classList.add("win");
      sorteados.push(final);
      salvar(); render(); confete();
    }
  }, 75);
};

$("reset").onclick = () => {
  sorteados = []; const r = $("result"); r.textContent = "?"; r.classList.remove("win"); salvar(); render();
};

let confirmTimer = null;
$("clear").onclick = () => {
  const b = $("clear");
  if (!nomes.length) return;
  if (!b.classList.contains("confirm")) {
    b.classList.add("confirm");
    b.textContent = "Certeza? Clica de novo";
    confirmTimer = setTimeout(() => { b.classList.remove("confirm"); b.textContent = "🗑️ Excluir tudo"; }, 3500);
    return;
  }
  clearTimeout(confirmTimer);
  b.classList.remove("confirm");
  b.textContent = "🗑️ Excluir tudo";
  nomes = []; sorteados = [];
  const r = $("result"); r.textContent = "?"; r.classList.remove("win");
  salvar(); render();
};

/* ---------- NÚMEROS ---------- */
function intervaloValido() {
  const { min, max } = num;
  return Number.isSafeInteger(min) && Number.isSafeInteger(max) && min <= max;
}
// números já sorteados que estão dentro do intervalo atual
function usadosNoIntervalo() {
  return new Set(num.hist.filter(n => n >= num.min && n <= num.max));
}

function renderNum() {
  const ok = intervaloValido();
  const total = ok ? num.max - num.min + 1 : 0;
  const usados = ok ? usadosNoIntervalo().size : 0;
  const restam = num.rep ? total : total - usados;

  if (!ok) {
    $("nInfo").textContent = "Confira o intervalo: o primeiro número precisa ser menor ou igual ao segundo.";
    $("nProg").style.width = "0%";
  } else if (num.rep) {
    $("nInfo").textContent = `${fmt(total)} números possíveis (de ${fmt(num.min)} a ${fmt(num.max)}) · podem repetir`;
    $("nProg").style.width = "0%";
  } else {
    $("nInfo").textContent = `${fmt(restam)} de ${fmt(total)} números ainda no sorteio`;
    $("nProg").style.width = (usados / total * 100) + "%";
  }
  $("sortearN").disabled = !ok || restam <= 0;

  const h = $("histN");
  h.innerHTML = "";
  if (!num.hist.length) { h.innerHTML = '<div class="empty"><span>🎟️</span>Nenhum número sorteado ainda</div>'; return; }
  num.hist.forEach(n => { const li = document.createElement("li"); li.textContent = fmt(n); h.appendChild(li); });
}

function lerCampos() {
  const a = parseInt($("nMin").value, 10), b = parseInt($("nMax").value, 10);
  num.min = a; num.max = b;
  num.rep = $("nRep").checked;
  salvar(); renderNum();
}
["nMin", "nMax"].forEach(id => $(id).addEventListener("input", lerCampos));
$("nRep").addEventListener("change", lerCampos);
["nMin", "nMax"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") $("sortearN").click(); }));

function aleatorioNoIntervalo() {
  const { min, max } = num;
  const total = max - min + 1;
  const rnd = () => min + Math.floor(Math.random() * total);
  if (num.rep) return rnd();
  const usados = usadosNoIntervalo();
  if (usados.size >= total) return null;
  if (usados.size < total / 2) {
    let x; do { x = rnd(); } while (usados.has(x));
    return x;
  }
  const livres = [];
  for (let n = min; n <= max; n++) if (!usados.has(n)) livres.push(n);
  return livres[Math.floor(Math.random() * livres.length)];
}

$("sortearN").onclick = () => {
  if (!intervaloValido()) return;
  const final = aleatorioNoIntervalo();
  if (final === null) return;
  const r = $("resultN");
  r.classList.remove("win"); r.classList.add("spin");
  $("sortearN").disabled = true;
  let t = 0;
  const iv = setInterval(() => {
    r.textContent = fmt(num.min + Math.floor(Math.random() * (num.max - num.min + 1)));
    if (++t >= 18) {
      clearInterval(iv);
      r.classList.remove("spin");
      r.textContent = fmt(final);
      void r.offsetWidth;
      r.classList.add("win");
      num.hist.push(final);
      salvar(); renderNum(); confete();
    }
  }, 75);
};

$("resetN").onclick = () => {
  num.hist = []; const r = $("resultN"); r.textContent = "?"; r.classList.remove("win"); salvar(); renderNum();
};

/* ---------- CHAVEAMENTO ---------- */
const embaralhar = a => {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
};
// ordem padrão de chave: 1 x último, 2 x penúltimo... (folgas espalhadas, nunca folga x folga)
function seedOrder(size) {
  let o = [1];
  while (o.length < size) { const len = o.length * 2; o = o.flatMap(x => [x, len + 1 - x]); }
  return o;
}
// todos contra todos (método do círculo)
function roundRobin(times) {
  const t = times.slice(); if (t.length % 2) t.push(null);
  const n = t.length, rs = [];
  for (let r = 0; r < n - 1; r++) {
    const jogos = [];
    for (let i = 0; i < n / 2; i++) { const a = t[i], b = t[n - 1 - i]; if (a && b) jogos.push([a, b]); }
    rs.push(jogos);
    t.splice(1, 0, t.pop());
  }
  return rs;
}
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const nomeMod = () => ch.mod === "futsal" ? "⚽ Futsal" : "🏐 Vôlei";
const gruposEfetivos = (d = cur()) => { return Math.min(Math.max(1, parseInt(d.grupos, 10) || 1), Math.max(1, Math.floor(d.sel.length / 2))); };
const temResultados = () => { const s = cur().sorteio; return !!s && s.tipo === "mata" && s.win.some(r => r.some(Boolean)); };

function definir(nome, on) {
  const d = cur(), i = d.sel.indexOf(nome);
  if (on && i < 0) d.sel.push(nome);
  if (!on && i >= 0) d.sel.splice(i, 1);
}
function trocarMod(m, t = ch.turno) {
  ch.mod = m; ch.turno = t;
  [["cZerar", "↺ Zerar resultados"], ["cReset", "🗑️ Resetar chaveamento"]].forEach(([i, tx]) => { $(i).classList.remove("confirm"); $(i).textContent = tx; });
  $("cGrupos").value = cur().grupos || 2;
  $("resultC").textContent = "?"; $("resultC").classList.remove("win");
  salvar(); renderChave();
}
function larguraChave() {
  const s = cur().sorteio;
  const largo = modo === "chave" && !!s && s.tipo === "mata" && s.slots.length >= 8;
  document.querySelector("main").classList.toggle("wide", largo);
}

function gerarChave(d = cur()) {
  const n = d.sel.length, emb = embaralhar(d.sel), titulo = "";
  if (d.formato === "grupos") {
    const G = gruposEfetivos(d), grupos = Array.from({ length: G }, () => []);
    emb.forEach((t, i) => grupos[i % G].push(t));
    return { tipo: "grupos", titulo, grupos };
  }
  let size = 2; while (size < n) size *= 2;
  const slots = seedOrder(size).map(x => x <= n ? emb[x - 1] : null);
  const win = []; for (let m = size / 2; m >= 1; m /= 2) win.push(Array(m).fill(null));
  return { tipo: "mata", titulo, slots, win };
}

function renderChave() {
  const d = cur(), n = d.sel.length;
  $("mFutsal").classList.toggle("on", ch.mod === "futsal");
  $("mVolei").classList.toggle("on", ch.mod === "volei");
  $("tManha").classList.toggle("on", ch.turno === "manha");
  $("tTarde").classList.toggle("on", ch.turno === "tarde");

  const box = $("cSeries"); box.innerHTML = "";
  TURNOS[ch.turno].series.forEach(sr => {
    const lista = TURMAS.filter(t => t.serie === sr);
    const todas = lista.every(t => d.sel.includes(t.nome));
    const head = el("div", "sh"); head.append(el("span", "sl", "🎓 Turmas de " + SERIES[sr] + ":"));
    const bt = el("button", "sec", todas ? "Desmarcar" : "Marcar todas");
    bt.onclick = () => { lista.forEach(t => definir(t.nome, !todas)); salvar(); renderChave(); };
    head.append(bt);
    const row = el("div", "tchips");
    lista.forEach(t => {
      const on = d.sel.includes(t.nome);
      const c = el("div", "tc" + (on ? " on" : ""));
      c.setAttribute("role", "button"); c.setAttribute("aria-pressed", on); c.tabIndex = 0;
      c.append(el("i", null, t.b), el("span", null, t.nome));
      const tog = () => { definir(t.nome, !on); salvar(); renderChave(); };
      c.onclick = tog;
      c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } };
      row.append(c);
    });
    box.append(head, row);
  });

  $("cCount").textContent = n;
  $("cInfo").textContent = n === 0 ? "Marque as turmas que vão jogar " + (ch.mod === "futsal" ? "futsal" : "vôlei") + " (mínimo 2)."
    : n < 2 ? "Falta pelo menos mais uma turma." : `${n} turmas participando.`;

  const g = d.formato === "grupos";
  $("fMata").classList.toggle("on", !g);
  $("fGrupos").classList.toggle("on", g);
  $("gField").classList.toggle("hidden", !g);
  if (n < 2) $("fInfo").textContent = "";
  else if (g) {
    const G = gruposEfetivos();
    $("fInfo").textContent = `${G} ${G === 1 ? "grupo" : "grupos"} · cerca de ${Math.ceil(n / G)} turmas por grupo, todos contra todos dentro do grupo.`;
  } else {
    let size = 2; while (size < n) size *= 2;
    const f = size - n;
    $("fInfo").textContent = f ? `${f} ${f === 1 ? "turma" : "turmas"} com folga na primeira fase (sorteadas também).` : "Sem folgas: todo mundo joga na primeira fase.";
  }
  $("sortearC").disabled = n < 2;
  renderSaida();
}

function renderSaida() {
  const s = cur().sorteio;
  $("cOut").classList.toggle("hidden", !s);
  larguraChave();
  if (!s) return;
  $("cZerar").classList.toggle("hidden", s.tipo !== "mata");
  $("cZerar").disabled = !temResultados();
  $("cOutTitulo").textContent = nomeMod() + " · " + TURNOS[ch.turno].nome + (s.tipo === "mata" ? " — Mata-mata" : " — Grupos");
  const body = $("cBody"); body.innerHTML = "";

  if (s.tipo === "grupos") {
    s.grupos.forEach((g, gi) => {
      const bx = el("div", "grp");
      bx.append(el("h3", null, "Grupo " + String.fromCharCode(65 + gi)));
      const ul = el("ul"); g.forEach(t => ul.append(el("li", null, t))); bx.append(ul);
      roundRobin(g).forEach((jogos, ri) => {
        const dv = el("div", "rod"); dv.append(el("b", null, "Rodada " + (ri + 1)));
        dv.append(document.createTextNode(jogos.map(j => curto(j[0]) + " × " + curto(j[1])).join("  ·  ")));
        bx.append(dv);
      });
      body.append(bx);
    });
    $("cDica").textContent = "";
    return;
  }

  const tam = s.slots.length, nr = s.win.length;
  const equipe = (r, i, lado) => r === 0 ? s.slots[2 * i + lado] : vencedor(r - 1, 2 * i + lado);
  function vencedor(r, i) {
    const a = equipe(r, i, 0), b = equipe(r, i, 1);
    if (r === 0) { if (a && !b) return a; if (b && !a) return b; }
    if (!a || !b) return null;
    const w = s.win[r][i];
    return w === "a" ? a : w === "b" ? b : null;
  }
  function escolher(r, i, lado) {
    const antes = vencedor(nr - 1, 0);
    s.win[r][i] = s.win[r][i] === lado ? null : lado;
    let j = i; for (let k = r + 1; k < nr; k++) { j >>= 1; s.win[k][j] = null; }
    salvar(); renderSaida();
    if (!antes && vencedor(nr - 1, 0)) confete();
  }
  function caixa(r, i, cls) {
    const a = equipe(r, i, 0), b = equipe(r, i, 1), w = vencedor(r, i);
    const bye = r === 0 && (!a || !b);
    const m = el("div", "mt" + (cls ? " " + cls : ""));
    [[a, "a"], [b, "b"]].forEach(([t, lado]) => {
      const row = el("div", "tm");
      if (!t) { row.classList.add(r === 0 ? "bye" : "tbd"); row.textContent = r === 0 ? "folga" : "a definir"; }
      else {
        row.textContent = curto(t); row.title = t;
        if (w) row.classList.add(w === t ? "w" : "l");
        if (a && b && !bye) { row.classList.add("clk"); row.onclick = () => escolher(r, i, lado); }
      }
      m.append(row);
    });
    return m;
  }
  // monta recursivamente uma metade da chave: [filhos] -> partida
  function no(r, i, raiz) {
    const nd = el("div", "nd");
    const mt = caixa(r, i, "out" + (raiz ? " root" : "") + (r > 0 ? " has" : ""));
    if (r > 0) { const k = el("div", "kids"); k.append(no(r - 1, 2 * i), no(r - 1, 2 * i + 1)); nd.append(k); }
    nd.append(mt);
    return nd;
  }

  const tree = el("div", "tree");
  if (nr >= 2) { const lf = el("div", "half lf"); lf.append(no(nr - 2, 0, true)); tree.append(lf); }
  const mid = el("div", "mid"), fin = el("div", "fin");
  fin.append(el("h4", null, "Final"), caixa(nr - 1, 0, ""));
  const campeao = vencedor(nr - 1, 0);
  if (campeao) fin.append(el("div", "champ", "🏆 Campeão: " + curto(campeao)));
  mid.append(fin); tree.append(mid);
  if (nr >= 2) { const rt = el("div", "half rt"); rt.append(no(nr - 2, 1, true)); tree.append(rt); }
  const sc = el("div", "scroll"); sc.append(tree); body.append(sc);
  $("cDica").textContent = "Toque em uma turma pra marcar quem venceu — ela avança sozinha. Toque de novo pra desmarcar.";
}

// botões que pedem confirmação com um segundo clique
function duploClique(id, rotulo, acao) {
  const b = $(id); let t = null;
  b.onclick = () => {
    if (!b.classList.contains("confirm")) {
      b.classList.add("confirm"); b.textContent = "Certeza? Clica de novo";

      return;
    }
    clearTimeout(t); b.classList.remove("confirm"); b.textContent = rotulo; acao();
  };
}
// mantém o sorteio e apaga só os vencedores marcados
duploClique("cZerar", "↺ Zerar resultados", () => {

  s.win = s.win.map(r => r.map(() => null));

/* ---------- imagem do chaveamento ---------- */
const FONTE = 'Poppins, system-ui, -apple-system, "Segoe UI", sans-serif';
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function cabem(c, t, w) {
  if (c.measureText(t).width <= w) return t;
  while (t.length > 1 && c.measureText(t + "…").width > w) t = t.slice(0, -1);
  return t + "…";
}
function chaveFns(s) {
  const equipe = (r, i, lado) => r === 0 ? s.slots[2 * i + lado] : vencedor(r - 1, 2 * i + lado);
  function vencedor(r, i) {
    const a = equipe(r, i, 0), b = equipe(r, i, 1);
    if (r === 0) { if (a && !b) return a; if (b && !a) return b; }
    if (!a || !b) return null;
    const w = s.win[r][i];
    return w === "a" ? a : w === "b" ? b : null;
  }
  return { equipe, vencedor };
}

const HEAD = 72, PADI = 36;
function layoutMata(s) {
  const tam = s.slots.length, nr = s.win.length;
  const BW = 172, BH = 68, RH = 34, GV = 16, CG = 38, TOP = 78;
  const L = Math.max(tam / 4, 1);
  const W = Math.max(2 * PADI + (nr - 1) * 2 * (BW + CG) + BW, 560);
  const H = HEAD + TOP + L * (BH + GV) - GV + PADI;
  const { equipe, vencedor } = chaveFns(s);
  const base = HEAD + TOP + BH / 2;
  const xOf = (r, i) => {
    if (r === nr - 1) return (W - BW) / 2;
    const cnt = tam / 2 ** (r + 1);
    return i >= cnt / 2 ? W - PADI - BW - r * (BW + CG) : PADI + r * (BW + CG);
  };
  const yc = (r, i) => {
    if (nr === 1) return base;
    if (r === 0) { const half = tam / 4, j = i < half ? i : i - half; return HEAD + TOP + j * (BH + GV) + BH / 2; }
    return (yc(r - 1, 2 * i) + yc(r - 1, 2 * i + 1)) / 2;
  };
  function draw(c) {
    // ligações
    c.strokeStyle = "#a29bfe"; c.lineWidth = 2; c.lineJoin = "round";
    const link = (rc, ic, rp, ip) => {
      const xc = xOf(rc, ic), xp = xOf(rp, ip), y1 = yc(rc, ic), y2 = yc(rp, ip);
      const x1 = xc < xp ? xc + BW : xc, x2 = xc < xp ? xp : xp + BW, xm = (x1 + x2) / 2;
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(xm, y1); c.lineTo(xm, y2); c.lineTo(x2, y2); c.stroke();
    };
    for (let r = 1; r < nr; r++) for (let i = 0; i < tam / 2 ** (r + 1); i++) { link(r - 1, 2 * i, r, i); link(r - 1, 2 * i + 1, r, i); }
    // partidas
    for (let r = 0; r < nr; r++) for (let i = 0; i < tam / 2 ** (r + 1); i++) {
      const a = equipe(r, i, 0), b = equipe(r, i, 1), w = vencedor(r, i);
      const x = xOf(r, i), y = yc(r, i) - BH / 2, final = r === nr - 1;
      c.save(); c.shadowColor = "rgba(108,92,231,.20)"; c.shadowBlur = 10; c.shadowOffsetY = 3;
      rr(c, x, y, BW, BH, 12); c.fillStyle = "#ffffff"; c.fill(); c.restore();
      c.save(); rr(c, x, y, BW, BH, 12); c.clip();
      [a, b].forEach((t, k) => { if (t && w === t) { c.fillStyle = "rgba(0,184,148,.24)"; c.fillRect(x, y + k * RH, BW, RH); } });
      c.restore();
      rr(c, x, y, BW, BH, 12); c.strokeStyle = final ? "#6c5ce7" : "#d6d0fa"; c.lineWidth = final ? 2 : 1.2; c.stroke();
      c.beginPath(); c.moveTo(x, y + RH); c.lineTo(x + BW, y + RH); c.strokeStyle = "#e4e0fb"; c.lineWidth = 1; c.stroke();
      [a, b].forEach((t, k) => {
        const ty = y + k * RH + RH / 2 + 1;
        c.textBaseline = "middle"; c.textAlign = "left";
        if (!t) { c.font = "italic 500 12px " + FONTE; c.fillStyle = "#8a8fa8"; c.fillText(r === 0 ? "folga" : "a definir", x + 12, ty); return; }
        const perdeu = w && w !== t;
        c.font = (w === t ? "700 " : "600 ") + "14px " + FONTE;
        c.fillStyle = perdeu ? "#a5a9bd" : "#1d1f2b";
        const txt = cabem(c, curto(t), BW - 24);
        c.fillText(txt, x + 12, ty);
        if (perdeu) { const tw = c.measureText(txt).width; c.beginPath(); c.moveTo(x + 12, ty); c.lineTo(x + 12 + tw, ty); c.strokeStyle = "#a5a9bd"; c.lineWidth = 1.2; c.stroke(); }
      });
      if (final) {
        c.textAlign = "center"; c.textBaseline = "alphabetic";
        c.font = "700 11px " + FONTE; c.fillStyle = "#6b7089"; c.fillText("F I N A L", x + BW / 2, y - 12);
        const campeao = vencedor(nr - 1, 0);
        if (campeao) {
          const txt = "🏆 Campeão: " + curto(campeao);
          c.font = "800 15px " + FONTE;
          const pw = c.measureText(txt).width + 36, px = x + BW / 2 - pw / 2, py = y - 62;
          const g = c.createLinearGradient(px, py, px + pw, py); g.addColorStop(0, "#6c5ce7"); g.addColorStop(1, "#fd79a8");
          rr(c, px, py, pw, 34, 17); c.fillStyle = g; c.fill();
          c.fillStyle = "#fff"; c.textBaseline = "middle"; c.fillText(txt, x + BW / 2, py + 18);
        }
      }
    }
  }
  return { W, H, draw };
}

function layoutGrupos(s) {
  const G = s.grupos.length, cols = Math.min(G, 3), CW = 330, GAP = 22;
  const W = Math.max(2 * PADI + cols * CW + (cols - 1) * GAP, 480);
  const x0 = (W - (cols * CW + (cols - 1) * GAP)) / 2;
  const info = s.grupos.map(g => ({ g, rod: roundRobin(g) }));
  const alt = o => 50 + o.g.length * 24 + 12 + o.rod.reduce((acc, jogos) => acc + 26 + jogos.length * 22, 0) + 10;
  const linhas = [];
  for (let i = 0; i < G; i += cols) { const grp = info.slice(i, i + cols); linhas.push({ grp, h: Math.max(...grp.map(alt)) }); }
  const H = HEAD + 10 + linhas.reduce((a, l) => a + l.h + GAP, 0) + PADI - GAP;
  function draw(c) {
    let y = HEAD + 10;
    linhas.forEach(l => {
      l.grp.forEach((o, k) => {
        const x = x0 + k * (CW + GAP), gi = info.indexOf(o);
        c.save(); c.shadowColor = "rgba(108,92,231,.18)"; c.shadowBlur = 10; c.shadowOffsetY = 3;
        rr(c, x, y, CW, l.h, 16); c.fillStyle = "#fff"; c.fill(); c.restore();
        rr(c, x, y, CW, l.h, 16); c.strokeStyle = "#d6d0fa"; c.lineWidth = 1.2; c.stroke();
        c.textAlign = "left"; c.textBaseline = "middle";
        c.font = "700 17px " + FONTE; c.fillStyle = "#6c5ce7"; c.fillText("Grupo " + String.fromCharCode(65 + gi), x + 18, y + 26);
        let yy = y + 56;
        o.g.forEach(t => { c.font = "600 14px " + FONTE; c.fillStyle = "#1d1f2b"; c.fillText(cabem(c, "• " + t, CW - 36), x + 18, yy); yy += 24; });
        yy += 12;
        o.rod.forEach((jogos, ri) => {
          c.font = "700 12px " + FONTE; c.fillStyle = "#6b7089"; c.fillText("RODADA " + (ri + 1), x + 18, yy); yy += 26;
          jogos.forEach(j => { c.font = "500 13px " + FONTE; c.fillStyle = "#1d1f2b"; c.fillText(cabem(c, curto(j[0]) + "  ×  " + curto(j[1]), CW - 36), x + 18, yy - 6); yy += 22; });
        });
      });
      y += l.h + GAP;
    });
  }
  return { W, H, draw };
}

async function desenharImagem(s) {
  try { await Promise.race([document.fonts.load("700 14px Poppins"), new Promise(r => setTimeout(r, 800))]); } catch (e) {}
  const lay = s.tipo === "mata" ? layoutMata(s) : layoutGrupos(s);
  const SC = 2, cv = document.createElement("canvas");
  cv.width = Math.round(lay.W * SC); cv.height = Math.round(lay.H * SC);
  const c = cv.getContext("2d");
  c.scale(SC, SC);
  const bg = c.createLinearGradient(0, 0, lay.W, lay.H);
  bg.addColorStop(0, "#eef0ff"); bg.addColorStop(.5, "#fdeefe"); bg.addColorStop(1, "#e3fbf4");
  c.fillStyle = bg; c.fillRect(0, 0, lay.W, lay.H);
  c.textAlign = "left"; c.textBaseline = "middle";
  c.font = "800 24px " + FONTE; c.fillStyle = "#1d1f2b";
  c.fillText(nomeMod() + (s.tipo === "mata" ? " — Mata-mata" : " — Grupos"), PADI, 32);
  c.font = "500 13px " + FONTE; c.fillStyle = "#6b7089";
  c.fillText(TURNOS[ch.turno].nome + " · " + TURNOS[ch.turno].sub, PADI, 56);
  c.textAlign = "right"; c.font = "500 12px " + FONTE; c.fillStyle = "#6b7089";
  c.fillText(new Date().toLocaleDateString("pt-BR"), lay.W - PADI, 38);
  lay.draw(c);
  return cv;
}

$("cCopy").onclick = async () => {
  const s = cur().sorteio; if (!s) return;
  const b = $("cCopy"), rotulo = "📋 Copiar imagem";
  const fim = msg => { b.textContent = msg; setTimeout(() => { b.textContent = rotulo; }, 2200); };
  b.textContent = "Gerando...";
  const blobP = desenharImagem(s).then(cv => new Promise(res => cv.toBlob(res, "image/png")));
  const nomeArq = `chaveamento-${ch.mod}-${ch.turno}.png`;
  try {
    // passa a promessa direto: mantém o gesto do clique (necessário no Safari/iPhone)
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blobP })]);
    return fim("✅ Imagem copiada!");
  } catch (e) {}
  try {
    const blob = await blobP;
    const file = new File([blob], nomeArq, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return fim("✅ Pronto!"); }
    throw 0;
  } catch (e) {
    if (e && e.name === "AbortError") return fim(rotulo);
    try {
      const blob = await blobP, a = el("a"); a.href = URL.createObjectURL(blob); a.download = nomeArq;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      fim("⬇️ Imagem baixada");
    } catch (e2) { fim("Não deu pra gerar"); }
  }
};

/* ---------- confete ---------- */
const cv = $("fx"), ctx = cv.getContext("2d");
let parts = [], anim = null;
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", resize); resize();
function confete() {
  const cores = ["#6c5ce7", "#fd79a8", "#55efc4", "#ffeaa7", "#74b9ff", "#e17055"];
  for (let i = 0; i < 180; i++) parts.push({
    x: cv.width / 2, y: cv.height * 0.45,
    vx: (Math.random() - .5) * 18, vy: Math.random() * -15 - 3,
    s: Math.random() * 8 + 4, c: cores[i % cores.length], round: i % 4 === 0,
    r: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 130
  });
  if (!anim) loop();
}
function loop() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += .35; p.vx *= .99; p.r += p.vr; p.life--;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.globalAlpha = Math.max(p.life / 130, 0);
    ctx.fillStyle = p.c;
    if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); }
    else ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
    ctx.restore();
  });
  parts = parts.filter(p => p.life > 0);
  anim = parts.length ? requestAnimationFrame(loop) : null;
  if (!anim) ctx.clearRect(0, 0, cv.width, cv.height);
}
